name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 主分支构建不中途取消，避免在导出 BuildKit 缓存时被截断；PR 仍取消旧提交。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the channel, components and wasm target.
        run: rustup show active-toolchain
      - name: Restore the cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install wasm-bindgen CLI
        # The CLI and wasm-bindgen crate share a private ABI version.
        run: |
          curl --retry 5 --retry-all-errors --connect-timeout 30 -fsSL \
            -o /tmp/wasm-bindgen.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          install -m 0755 /tmp/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen "$HOME/.cargo/bin/"
          wasm-bindgen --version
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config \
            libbz2-dev liblzma-dev libzstd-dev liblz4-dev libssl-dev libxml2-dev libacl1-dev
      - name: Check the workspace
        # fmt + clippy (-D warnings) + the full test suite + wasm32 type-check.
        run: cargo xtask check
      - name: Audit Rust dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cargo-audit
          key: cargo-audit-0.22.2
      - name: Run cargo-audit
        run: |
          export PATH="$HOME/.cargo-audit/bin:$PATH"
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cargo-audit"
          cargo audit --file Cargo.lock
      - name: Build release artifacts
        run: cargo xtask build

  container:
    name: Build Rust image and Chromium E2E
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/e2e
        # Browser E2E is a separate test package. It has no Vue, Vite or
        # production application dependency.
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Build checked amd64 image once
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: revaro-e2e:local
          cache-from: type=gha,scope=revaro-image-amd64-v3
          cache-to: type=gha,scope=revaro-image-amd64-v3,mode=max,ignore-error=true,timeout=10m
      - name: Build and start the real Revaro stack
        run: docker compose -f compose.e2e.yml up -d --no-build
      - name: Wait for readiness
        run: |
          for _attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:18080/readyz && exit 0
            sleep 2
          done
          docker compose -f compose.e2e.yml logs
          exit 1
      - name: Run Rust browser E2E
        working-directory: tests/e2e
        run: npx playwright test rust-media-ui.spec.ts rust-reader-ui.spec.ts --config=playwright.config.ts
      - name: Collect container logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > e2e-container.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            e2e-container.log
      - name: Stop E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [rust, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Private local file manager with native media playback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=revaro-image-amd64-v3
      - name: Record image digest
        run: echo "Published ghcr.io/vesperglow/revaro@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
