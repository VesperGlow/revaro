name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 主分支构建不中途取消，避免在导出 BuildKit 缓存时被截断；PR 仍取消旧提交。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the channel, components and wasm target.
        run: rustup show active-toolchain
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: revaro-rust-v1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libssl-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test shared transport recovery
        run: node --test tests/transport/*.test.mjs
      - name: Check the workspace
        # fmt + clippy (-D warnings) + the full test suite + wasm32 type-check.
        run: cargo xtask check
      - name: Verify public ports without capabilities
        # Only the disposable host's low-port threshold changes; the test still
        # runs as its unprivileged user, as in rootless host networking.
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          REVARO_INGRESS_TEST_PUBLIC_PORTS=1 cargo test -p revaro-server --test public_ingress
      - name: Audit Rust dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cargo-audit
          key: cargo-audit-0.22.2
      - name: Run cargo-audit
        run: |
          export PATH="$HOME/.cargo-audit/bin:$PATH"
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cargo-audit"
          cargo audit --file Cargo.lock
      - name: Build the release server for load checks
        # The release web bundle is built and exercised by the container job.
        run: cargo build --locked --release -p revaro-server
      - name: Check personal-library load and interrupted-upload recovery
        run: python3 tests/load/resilience.py --binary target/release/revaro --files 100000 --requests 600 --workers 8 --max-p95-ms 2000 --output target/resilience-load.json
      - name: Upload resilience measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resilience-load
          path: target/resilience-load.json

  container:
    name: Build Rust image and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/e2e
        # Browser E2E is a separate test package. It has no Vue, Vite or
        # production application dependency.
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils
      - name: Start virtual audio output for native playback tests
        # Firefox needs an audio sink even when the test WAV contains silence.
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=revaro_e2e
          pactl set-default-sink revaro_e2e
          pactl list short sinks
      - name: Validate Compose origin defaults
        run: |
          compose_default_base_url="$(APP_PORT=18081 APP_BASE_URL= docker compose -f compose.local.yml config --format json | jq -r '.services.revaro.environment.APP_BASE_URL')"
          test "$compose_default_base_url" = "http://localhost:18081"
          compose_custom_base_url="$(APP_DOMAIN=files.example.test APP_BASE_URL=https://files.example.test docker compose -f compose.yml config --format json | jq -r '.services.revaro.environment.APP_BASE_URL')"
          test "$compose_custom_base_url" = "https://files.example.test"
          public_compose="$(APP_DOMAIN=files.example.test APP_BASE_URL= COOKIE_SECURE= docker compose -f compose.yml config --format json)"
          jq -e '.services.revaro.environment.APP_DOMAIN == "files.example.test" and .services.revaro.environment.APP_BASE_URL == "" and .services.revaro.environment.COOKIE_SECURE == ""' <<<"$public_compose" >/dev/null
          host_compose="$(APP_DOMAIN=files.example.test docker compose -f compose.host.yml config --format json)"
          jq -e '.services.revaro.network_mode == "host" and (.services.revaro.ports // [] | length) == 0 and (.services.revaro.sysctls // {} | length) == 0' <<<"$host_compose" >/dev/null
          example_cookie_secure="$(sed -n 's/^COOKIE_SECURE=//p' .env.example)"
          test -z "$example_cookie_secure"
      - name: Validate production Compose hardening
        run: |
          compose_json="$(APP_DOMAIN=files.example.test docker compose -f compose.yml config --format json)"
          jq -e '.services.revaro.read_only == true' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.restart == "unless-stopped"' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.security_opt | index("no-new-privileges:true") != null' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.cap_drop | index("ALL") != null' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.tmpfs | any(.[]; startswith("/tmp:size=1g"))' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.volumes | any(.[]; .type == "volume" and .target == "/data")' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.volumes | any(.[]; .type == "volume" and .target == "/objects")' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.volumes | any(.[]; .type == "volume" and .target == "/caches")' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.environment.APP_DATA_DIR == "/data" and .services.revaro.environment.APP_OBJECTS_DIR == "/objects" and .services.revaro.environment.APP_CACHES_DIR == "/caches" and .services.revaro.environment.APP_WEB_DIR == "/opt/revaro/web"' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.healthcheck.test == ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1:443/readyz"]' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.ports | length == 3 and any(.[]; .target == 80 and .published == "80" and .protocol == "tcp") and any(.[]; .target == 443 and .published == "443" and .protocol == "tcp") and any(.[]; .target == 443 and .published == "443" and .protocol == "udp")' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.environment.APP_ADDR == "0.0.0.0:80" and .services.revaro.environment.APP_TLS_ADDR == "0.0.0.0:443" and .services.revaro.environment.APP_QUIC_ADDR == "0.0.0.0:443" and .services.revaro.environment.ACME_CACHE_DIR == "/data/acme" and .services.revaro.sysctls["net.ipv4.ip_unprivileged_port_start"] == "80"' <<<"$compose_json" >/dev/null
      - name: Generate tested image metadata
        id: tested-meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Private local file manager with native media playback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Build checked amd64 image once
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: revaro-e2e:local
          labels: ${{ steps.tested-meta.outputs.labels }}
          cache-from: type=gha,scope=revaro-image-amd64-v3
          cache-to: type=gha,scope=revaro-image-amd64-v3,mode=max,ignore-error=true,timeout=10m
      - name: Assert Rust-only runtime boundary
        run: |
          test "$(docker image inspect revaro-e2e:local --format '{{.Config.User}}')" = "revaro"
          if docker run --rm --entrypoint /bin/sh revaro-e2e:local \
              -c 'test "$(id -u)" = 10001 && test "$(id -g)" = 10001 && ! command -v go && ! command -v node && ! command -v npm'; then
            :
          else
            echo "legacy Go/Node/npm runtime toolchain found in the production image"
            exit 1
          fi
      - name: Build and start the real Revaro stack
        run: docker compose -f compose.e2e.yml up -d --no-build
      - name: Wait for readiness
        run: |
          for _attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:18080/readyz && exit 0
            sleep 2
          done
          docker compose -f compose.e2e.yml logs
          exit 1
      - name: Run Rust browser E2E
        working-directory: tests/e2e
        run: PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/chromium npx playwright test --config=playwright.config.ts --output=test-results/chromium
      - name: Check Firefox startup, editor, accounts and multi-device playback
        working-directory: tests/e2e
        run: E2E_BROWSER=firefox PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/firefox npx playwright test resilience.spec.ts anchor-position.spec.ts startup.spec.ts account-settings.spec.ts progress-sync.spec.ts native-file-loading.spec.ts --grep-invert 'mobile account settings' --config=playwright.config.ts --output=test-results/firefox
      - name: Check WebKit startup, editor, touch layout, accounts and multi-device playback
        working-directory: tests/e2e
        run: E2E_BROWSER=webkit PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/webkit npx playwright test resilience.spec.ts anchor-position.spec.ts startup.spec.ts account-settings.spec.ts progress-sync.spec.ts native-file-loading.spec.ts --config=playwright.config.ts --output=test-results/webkit
      - name: Check repeated editor and menu resource usage
        run: SOAK_OUTPUT=browser-soak.json node tests/load/browser-soak.cjs
      - name: Upload browser resource measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-soak
          path: browser-soak.json
      - name: Export the tested image
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker save --output /tmp/revaro-e2e.tar revaro-e2e:local
      - name: Upload the tested image
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v6
        with:
          name: revaro-tested-image
          path: /tmp/revaro-e2e.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Collect container logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > e2e-container.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            e2e-container.log
      - name: Stop E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [rust, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the tested image
        uses: actions/download-artifact@v6
        with:
          name: revaro-tested-image
          path: /tmp/revaro-tested-image
      - name: Load the tested image
        run: docker load --input /tmp/revaro-tested-image/revaro-e2e.tar
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Private local file manager with native media playback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Tag the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          first_tag=
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag revaro-e2e:local "$tag"
            if [ -z "$first_tag" ]; then first_tag="$tag"; fi
          done <<< "$IMAGE_TAGS"
          test -n "$first_tag"
      - name: Push the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          digest=
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            push_output="$(docker push "$tag" 2>&1)"
            printf '%s\n' "$push_output"
            current_digest="$(printf '%s\n' "$push_output" | sed -nE 's/.*(sha256:[0-9a-fA-F]{64}).*/\1/p' | tail -1)"
            if [ -n "$current_digest" ]; then digest="$current_digest"; fi
          done <<< "$IMAGE_TAGS"
          test -n "$digest"
          printf 'Published ghcr.io/vesperglow/revaro@%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
