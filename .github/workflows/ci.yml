name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web UI
        working-directory: web
        run: npm test
      - name: Build web UI
        working-directory: web
        run: npm run build
      - name: Lint web UI
        working-directory: web
        run: npm run lint
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/server
      - name: Test Rust data plane
        # Build the shared production base, then test in a disposable container
        # so CI does not commit a multi-gigabyte Cargo target directory as an
        # image layer.
        run: |
          docker build --target dataplane-base --tag revaro-dataplane-ci .
          docker run --rm revaro-dataplane-ci sh -c '
            rustup component add rustfmt clippy &&
            cargo fmt --check &&
            cargo clippy --locked --all-targets -- -D warnings &&
            cargo test --locked
          '
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: data-plane

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Lightweight private S3 file manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        run: echo "Published ghcr.io/vesperglow/revaro@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
