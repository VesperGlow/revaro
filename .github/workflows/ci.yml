name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 主分支构建不中途取消，避免在导出 BuildKit 缓存时被截断；PR 仍取消旧提交。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Deterministic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web UI
        working-directory: web
        run: npm test
      - name: Build web UI
        working-directory: web
        run: npm run build
      - name: Lint web UI
        working-directory: web
        run: npm run lint
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/server
      - name: Restore cargo-audit
        # cargo install 需要数分钟从源码编译；固定版本 + 缓存安装目录，
        # 命中时直接复用二进制。
        uses: actions/cache@v6
        with:
          path: ~/.cargo-audit
          key: cargo-audit-0.22.2
      - name: Audit Rust dependencies
        working-directory: data-plane
        # cargo-audit exits non-zero for vulnerabilities. Its default warning
        # policy reports informational/unmaintained/unsound advisories without
        # treating them as vulnerabilities; do not add `--deny warnings` here.
        run: |
          export PATH="$HOME/.cargo-audit/bin:$PATH"
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cargo-audit"
          cargo audit --file Cargo.lock

  container:
    name: Build amd64 image and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install web and Chromium dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build checked amd64 image once
        # Dockerfile 的生产依赖链内已包含 Rust fmt/clippy/test。这是唯一
        # 完整编译和缓存写入路径；缓存服务偶发不可用不会让编译失败。
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: revaro-e2e:local
          cache-from: type=gha,scope=revaro-image-amd64-v2
          cache-to: type=gha,scope=revaro-image-amd64-v2,mode=max,ignore-error=true,timeout=10m
      - name: Build and start the real Revaro stack
        run: docker compose -f compose.e2e.yml up -d --no-build
      - name: Wait for readiness
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:18080/readyz && exit 0
            sleep 2
          done
          docker compose -f compose.e2e.yml logs
          exit 1
      - name: Run Chromium E2E
        working-directory: web
        run: npm run e2e
      - name: Collect container logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > e2e-container.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            web/playwright-report/
            web/test-results/
            e2e-container.log
      - name: Stop E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Lightweight private S3 file manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # container job 已编译并 E2E 验证同一提交的 amd64 层。
          # 此处通常只组装镜像配置并推送，不再重复编译。
          cache-from: type=gha,scope=revaro-image-amd64-v2
          cache-to: type=gha,scope=revaro-image-amd64-v2,mode=max,ignore-error=true,timeout=10m
      - name: Record image digest
        run: echo "Published ghcr.io/vesperglow/revaro@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
