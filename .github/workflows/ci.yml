name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web UI
        working-directory: web
        run: npm test
      - name: Build web UI
        working-directory: web
        run: npm run build
      - name: Lint web UI
        working-directory: web
        run: npm run lint
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/server
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Test Rust data plane
        # Build the shared production base, then test in a disposable container
        # so CI does not commit a multi-gigabyte Cargo target directory as an
        # image layer. buildx 层缓存（与 e2e / publish 共享同一 GHA scope）命中时
        # 跳过 FFmpeg 源码编译与第三方依赖编译，容器内只需重编 revaro crate。
        # 本 job 是该 scope 唯一的并发写入方（e2e 只读，见下），避免两个
        # job 同时写同一 scope 互相驱逐导致整链重建甚至偶发失败。
        run: |
          docker buildx build \
            --load --target dataplane-src --tag revaro-dataplane-ci \
            --cache-from type=gha,scope=revaro-image \
            --cache-to type=gha,scope=revaro-image,mode=max .
          docker run --rm revaro-dataplane-ci sh -c '
            cargo fmt --check &&
            cargo clippy --locked --all-targets -- -D warnings &&
            cargo test --locked
          '
      - name: Restore cargo-audit
        # cargo install 需要数分钟从源码编译；固定版本 + 缓存安装目录，
        # 命中时直接复用二进制。
        uses: actions/cache@v4
        with:
          path: ~/.cargo-audit
          key: cargo-audit-0.22.2
      - name: Audit Rust dependencies
        working-directory: data-plane
        # cargo-audit exits non-zero for vulnerabilities. Its default warning
        # policy reports informational/unmaintained/unsound advisories without
        # treating them as vulnerabilities; do not add `--deny warnings` here.
        run: |
          export PATH="$HOME/.cargo-audit/bin:$PATH"
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cargo-audit"
          cargo audit --file Cargo.lock

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install web and Chromium dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Build Revaro image with shared layer cache
        # 只读共享 GHA 层缓存（写入方是 test job，二者并发运行）：
        # 避免两个 job 同时向同一 scope 写入、互相驱逐缓存层导致整链
        # 重建甚至偶发失败；镜像层由 test job 落盘，publish 直接命中。
        run: |
          docker buildx build \
            --load --tag revaro-e2e:local \
            --cache-from type=gha,scope=revaro-image .
      - name: Build and start the real Revaro stack
        run: docker compose -f compose.e2e.yml up -d --no-build
      - name: Wait for readiness
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:18080/readyz && exit 0
            sleep 2
          done
          docker compose -f compose.e2e.yml logs
          exit 1
      - name: Run Chromium E2E
        working-directory: web
        run: npm run e2e
      - name: Collect container logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > e2e-container.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            web/playwright-report/
            web/test-results/
            e2e-container.log
      - name: Stop E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Lightweight private S3 file manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # e2e job 已为同一提交构建并写入该 scope：publish 命中后只需
          # 恢复 + 推送，不再重复 Go / 前端 / data-plane / FFmpeg 构建。
          cache-from: type=gha,scope=revaro-image
          cache-to: type=gha,scope=revaro-image,mode=max
      - name: Record image digest
        run: echo "Published ghcr.io/vesperglow/revaro@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
