name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 主分支构建不中途取消，避免在导出 BuildKit 缓存时被截断；PR 仍取消旧提交。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the channel, components and wasm target.
        run: rustup show active-toolchain
      - name: Restore the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install wasm-bindgen CLI
        # The CLI and wasm-bindgen crate share a private ABI version.
        run: |
          curl --retry 5 --retry-all-errors --connect-timeout 30 -fsSL \
            -o /tmp/wasm-bindgen.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          install -m 0755 /tmp/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen "$HOME/.cargo/bin/"
          wasm-bindgen --version
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev \
            libbz2-dev liblzma-dev libzstd-dev liblz4-dev libssl-dev libxml2-dev libacl1-dev
      - name: Check the workspace
        # fmt + clippy (-D warnings) + the full test suite + wasm32 type-check.
        run: cargo xtask check
      - name: Audit Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo-audit
          key: cargo-audit-0.22.2
      - name: Run cargo-audit
        run: |
          export PATH="$HOME/.cargo-audit/bin:$PATH"
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cargo-audit"
          cargo audit --file Cargo.lock
      - name: Build release artifacts
        run: cargo xtask build

  container:
    name: Build Rust image and Chromium E2E
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/e2e
        # Browser E2E is a separate test package. It has no Vue, Vite or
        # production application dependency.
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Validate Compose origin defaults
        run: |
          compose_default_base_url="$(APP_PORT=18081 APP_BASE_URL= docker compose -f compose.yml config --format json | jq -r '.services.revaro.environment.APP_BASE_URL')"
          test "$compose_default_base_url" = "http://localhost:18081"
          compose_custom_base_url="$(APP_PORT=18081 APP_BASE_URL=https://files.example.test docker compose -f compose.yml config --format json | jq -r '.services.revaro.environment.APP_BASE_URL')"
          test "$compose_custom_base_url" = "https://files.example.test"
          compose_http_cookie_secure="$(APP_PORT=18081 APP_BASE_URL= COOKIE_SECURE= docker compose -f compose.yml config --format json | jq -r '.services.revaro.environment.COOKIE_SECURE')"
          test -z "$compose_http_cookie_secure"
          compose_https_cookie_secure="$(APP_PORT=18081 APP_BASE_URL=https://files.example.test COOKIE_SECURE= docker compose -f compose.yml config --format json | jq -r '.services.revaro.environment.COOKIE_SECURE')"
          test -z "$compose_https_cookie_secure"
          example_cookie_secure="$(sed -n 's/^COOKIE_SECURE=//p' .env.example)"
          test -z "$example_cookie_secure"
      - name: Validate production Compose hardening
        run: |
          compose_json="$(docker compose -f compose.yml config --format json)"
          jq -e '.services.revaro.read_only == true' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.restart == "unless-stopped"' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.security_opt | index("no-new-privileges:true") != null' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.cap_drop | index("ALL") != null' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.tmpfs | any(.[]; startswith("/tmp:size=1g"))' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.volumes | any(.[]; .type == "volume" and .target == "/data")' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.environment.APP_DATA_DIR == "/data" and .services.revaro.environment.APP_WORK_DIR == "/data/work" and .services.revaro.environment.APP_WEB_DIR == "/opt/revaro/web"' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.healthcheck.test == ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]' <<<"$compose_json" >/dev/null
          jq -e '.services.revaro.ports | length == 1 and .[0].host_ip == "127.0.0.1" and .[0].target == 8080 and .[0].protocol == "tcp"' <<<"$compose_json" >/dev/null
      - name: Generate tested image metadata
        id: tested-meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Private local file manager with native media playback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build checked amd64 image once
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: revaro-e2e:local
          labels: ${{ steps.tested-meta.outputs.labels }}
          cache-from: type=gha,scope=revaro-image-amd64-v3
          cache-to: type=gha,scope=revaro-image-amd64-v3,mode=max,ignore-error=true,timeout=10m
      - name: Assert Rust-only runtime boundary
        run: |
          test "$(docker image inspect revaro-e2e:local --format '{{.Config.User}}')" = "revaro"
          if docker run --rm --entrypoint /bin/sh revaro-e2e:local \
              -c 'test "$(id -u)" = 10001 && test "$(id -g)" = 10001 && ! command -v go && ! command -v node && ! command -v npm'; then
            :
          else
            echo "legacy Go/Node/npm runtime toolchain found in the production image"
            exit 1
          fi
      - name: Build and start the real Revaro stack
        run: docker compose -f compose.e2e.yml up -d --no-build
      - name: Wait for readiness
        run: |
          for _attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:18080/readyz && exit 0
            sleep 2
          done
          docker compose -f compose.e2e.yml logs
          exit 1
      - name: Run Rust browser E2E
        working-directory: tests/e2e
        run: npx playwright test rust-media-ui.spec.ts rust-reader-ui.spec.ts --config=playwright.config.ts
      - name: Export the tested image
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker save --output /tmp/revaro-e2e.tar revaro-e2e:local
      - name: Upload the tested image
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: revaro-tested-image
          path: /tmp/revaro-e2e.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Collect container logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > e2e-container.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            e2e-container.log
      - name: Stop E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [rust, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the tested image
        uses: actions/download-artifact@v8
        with:
          name: revaro-tested-image
          path: /tmp/revaro-tested-image
      - name: Load the tested image
        run: docker load --input /tmp/revaro-tested-image/revaro-e2e.tar
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/vesperglow/revaro
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=revaro
            org.opencontainers.image.description=Private local file manager with native media playback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Tag the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          first_tag=
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag revaro-e2e:local "$tag"
            if [ -z "$first_tag" ]; then first_tag="$tag"; fi
          done <<< "$IMAGE_TAGS"
          test -n "$first_tag"
      - name: Push the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          digest=
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            push_output="$(docker push "$tag" 2>&1)"
            printf '%s\n' "$push_output"
            current_digest="$(printf '%s\n' "$push_output" | sed -nE 's/.*(sha256:[0-9a-fA-F]{64}).*/\1/p' | tail -1)"
            if [ -n "$current_digest" ]; then digest="$current_digest"; fi
          done <<< "$IMAGE_TAGS"
          test -n "$digest"
          printf 'Published ghcr.io/vesperglow/revaro@%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
