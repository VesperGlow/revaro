services:
  revaro:
    image: "${REVARO_IMAGE:-ghcr.io/vesperglow/revaro:latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_ADDR: ":8080"
      APP_DATA_DIR: /data
      APP_WORK_DIR: /data/work
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8080}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      MEDIA_CACHE_CAPACITY: "${MEDIA_CACHE_CAPACITY:-2147483648}"
      UPLOAD_EXPIRES: "${UPLOAD_EXPIRES:-24h}"
      TRASH_RETENTION: "${TRASH_RETENTION:-720h}"
      GC_INTERVAL: "${GC_INTERVAL:-1h}"
      FLOW_CACHE_TTL: "${FLOW_CACHE_TTL:-720h}"
      FLOW_CACHE_CAPACITY: "${FLOW_CACHE_CAPACITY:-1073741824}"
      # Optional: S3 is used exclusively for SQLite database snapshots.
      BACKUP_ENABLED: "${BACKUP_ENABLED:-}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      BACKUP_RETENTION: "${BACKUP_RETENTION:-14}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_PATH_STYLE: "${S3_PATH_STYLE:-false}"
    volumes:
      - revaro-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  revaro-data:
