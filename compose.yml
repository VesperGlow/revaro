services:
  revaro:
    image: "${REVARO_IMAGE:-ghcr.io/vesperglow/revaro:latest}"
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN in .env to your public DNS hostname}"
      APP_ADDR: "${APP_ADDR:-0.0.0.0:80}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
      ACME_STAGING: "${ACME_STAGING:-false}"
      ACME_CACHE_DIR: /data/acme
      ACME_DIRECTORY_URL: "${ACME_DIRECTORY_URL:-}"
      ACME_CA_FILE: "${ACME_CA_FILE:-}"
      APP_DATA_DIR: /data
      APP_OBJECTS_DIR: /objects
      APP_CACHES_DIR: /caches
      APP_WEB_DIR: /opt/revaro/web
      APP_BASE_URL: "${APP_BASE_URL:-}"
      APP_HTTP2_BASE_URL: "${APP_HTTP2_BASE_URL:-}"
      APP_TLS_ADDR: "${APP_TLS_ADDR:-0.0.0.0:443}"
      APP_TLS_CERT: "${APP_TLS_CERT:-}"
      APP_TLS_KEY: "${APP_TLS_KEY:-}"
      APP_HTTP2_ADDR: "${APP_HTTP2_ADDR:-}"
      APP_QUIC_ADDR: "${APP_QUIC_ADDR:-0.0.0.0:443}"
      APP_QUIC_PUBLIC_PORT: "${APP_QUIC_PUBLIC_PORT:-443}"
      QUIC_CC_MODE: "${QUIC_CC_MODE:-aggressive}"
      QUIC_TARGET_MBPS: "${QUIC_TARGET_MBPS:-auto}"
      QUIC_MAX_MBPS: "${QUIC_MAX_MBPS:-250}"
      QUIC_GLOBAL_MAX_MBPS: "${QUIC_GLOBAL_MAX_MBPS:-1000}"
      QUIC_MAX_COMPENSATION_PERCENT: "${QUIC_MAX_COMPENSATION_PERCENT:-125}"
      QUIC_MAX_WINDOW_MIB: "${QUIC_MAX_WINDOW_MIB:-8}"
      QUIC_MAX_CONNECTIONS: "${QUIC_MAX_CONNECTIONS:-32}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      TRUSTED_PROXIES: ""
      MEDIA_CACHE_CAPACITY: "${MEDIA_CACHE_CAPACITY:-2147483648}"
      APP_MEMORY_BUDGET: "${APP_MEMORY_BUDGET:-8589934592}"
      UPLOAD_EXPIRES: "${UPLOAD_EXPIRES:-24h}"
      UPLOAD_IDLE_TIMEOUT: "${UPLOAD_IDLE_TIMEOUT:-60s}"
      UPLOAD_REQUEST_TIMEOUT: "${UPLOAD_REQUEST_TIMEOUT:-24h}"
      UPLOAD_MIN_FREE_BYTES: "${UPLOAD_MIN_FREE_BYTES:-67108864}"
      UPLOAD_CONCURRENCY: "${UPLOAD_CONCURRENCY:-8}"
      TRASH_RETENTION: "${TRASH_RETENTION:-720h}"
      GC_INTERVAL: "${GC_INTERVAL:-1h}"
      FLOW_CACHE_TTL: "${FLOW_CACHE_TTL:-720h}"
      FLOW_CACHE_CAPACITY: "${FLOW_CACHE_CAPACITY:-1073741824}"
    volumes:
      - revaro-data:/data
      - revaro-objects:/objects
      - revaro-caches:/caches
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1:443/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 300s

volumes:
  revaro-data:
  revaro-objects:
  revaro-caches:
