[package]
name = "revaro-core"
description = "Shared domain model, API contract, error model and validation for Revaro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Optional: only the server enables this, so the browser bundle never links an
# HTTP framework. It exists purely to implement `IntoResponse` for `ApiError`.
axum = { workspace = true, optional = true }

[features]
default = []
# Implement the HTTP transport traits for the shared error model.
axum = ["dep:axum"]

[dev-dependencies]
serde_json.workspace = true
