[package]
name = "revaro-server"
description = "Revaro Axum backend and application entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "revaro_server"
path = "src/lib.rs"

[[bin]]
name = "revaro"
path = "src/main.rs"

[dependencies]
revaro-core = { workspace = true, features = ["axum"] }

axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
mime_guess.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# Not in the root `[workspace.dependencies]` table: declared here so the shared
# manifest is not touched while other crates are mid-migration.
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
sha1 = "0.10"
time = "0.3"

# The workspace default enables only `jpeg`; the avatar sniffer and the TOTP QR
# code both need PNG encoding, so the feature is added here rather than globally.
image = { workspace = true, features = ["png"] }

[dev-dependencies]
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
