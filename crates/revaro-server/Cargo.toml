[package]
name = "revaro-server"
description = "Revaro Axum backend and application entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "revaro_server"
path = "src/lib.rs"

[[bin]]
name = "revaro"
path = "src/main.rs"

[dependencies]
revaro-core = { workspace = true, features = ["axum"] }
revaro-media.workspace = true
revaro-reader.workspace = true

axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
mime_guess.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# Not in the root `[workspace.dependencies]` table: declared here so the shared
# manifest is not touched while other crates are mid-migration.
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
sha1 = "0.10"
time = "0.3"
fs2 = "0.4.3"
url = "2"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11.19", default-features = false }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tower", "webpki-roots"] }
async-trait = "0.1"
dotenvy = "0.15"
socket2 = "0.6"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
http-body-util.workspace = true

# The workspace default enables only `jpeg`; the avatar sniffer and the TOTP QR
# code both need PNG encoding, so the feature is added here rather than globally.
image = { workspace = true, features = ["png"] }
zip.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
h2 = "0.4"
ring = "0.17"
