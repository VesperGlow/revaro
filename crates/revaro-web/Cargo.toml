[package]
name = "revaro-web"
description = "Revaro browser client (Leptos, client-side rendered to WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `cdylib` produces the wasm module; `rlib` lets the workspace type-check and
# unit-test the crate like any other member.
crate-type = ["cdylib", "rlib"]

[dependencies]
revaro-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# Everything browser-specific is only pulled in for the wasm target, so a native
# `cargo check --workspace` compiles this crate to an empty stub instead of
# failing on wasm-only APIs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
gloo-net.workspace = true
js-sys.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# The shell needs the DOM directly for `#app` mounting, `matchMedia` breakpoint
# detection and a couple of document-level listeners. `gloo-net` and `leptos`
# already enable many `web-sys` features; these are the ones this crate names
# itself, so a dependency bump cannot silently take them away.
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "CssStyleDeclaration",
    "AbortController",
    "AbortSignal",
    "Blob",
    "DataTransfer",
    "DragEvent",
    "Element",
    "Event",
    "EventSource",
    "EventTarget",
    "HtmlDetailsElement",
    "HtmlElement",
    "HtmlAudioElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlMediaElement",
    "HtmlTrackElement",
    "HtmlVideoElement",
    "History",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "Node",
    "NodeList",
    "PointerEvent",
    "ProgressEvent",
    "SubmitEvent",
    "Storage",
    "TextTrack",
    "TextTrackCueList",
    "TextTrackList",
    "TextTrackMode",
    "Window",
    "TimeRanges",
    "VttCue",
    "File",
    "FileList",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestUpload",
] }
