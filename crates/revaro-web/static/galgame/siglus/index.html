<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiglusEngine · Revaro</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:sans-serif}
#siglus-canvas{display:block;width:100%!important;height:100dvh!important;outline:none;touch-action:none}
#audio-hint{position:fixed;bottom:1.5rem;left:0;right:0;text-align:center;pointer-events:none;font-size:14px;text-shadow:0 1px 4px #000}
#loading{position:fixed;inset:0;place-content:center;text-align:center;pointer-events:none}
#loading:not([hidden]){display:grid}
#error{position:fixed;inset:5%;max-height:90%;overflow:auto;background:#2b1c1c;white-space:pre-wrap;padding:20px;border-radius:8px;z-index:2}
</style>
<canvas id="siglus-canvas" tabindex="0"></canvas>
<div id="loading" role="status">正在加载游戏…</div>
<div id="audio-hint" hidden>点击画面启用声音</div>
<pre id="error" role="alert" hidden></pre>
<script src="/galgame/siglus/fflate.js"></script>
<script type="module" src="/galgame/siglus/player.js"></script>
</html>
