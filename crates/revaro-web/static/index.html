<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is required by the ~62 `env(safe-area-inset-*)`
         uses in the ported stylesheets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f9" />
    <title>revaro · 私人网盘</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="64x64" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The ported cascade manifest; it @imports every stylesheet in order. -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Vue mounted here and the ported `responsive.css` styles `#app`
         (`min-width/max-width/min-height`), so the mount id is part of the DOM
         contract and is kept. -->
    <div id="app"></div>
    <script type="module">
      import init from '/revaro_web.js'
      init()
    </script>
    <noscript>Revaro 需要启用 JavaScript。</noscript>
  </body>
</html>
