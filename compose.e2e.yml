services:
  revaro:
    build: .
    image: revaro-e2e:local
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      APP_ADDR: ":8080"
      APP_DATA_DIR: /data
      APP_WORK_DIR: /data/work
      APP_BASE_URL: http://127.0.0.1:18080
      COOKIE_SECURE: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: revaro-e2e-password
    volumes:
      - revaro-e2e-data:/data

volumes:
  revaro-e2e-data:
