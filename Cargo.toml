[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `data-plane` is still a standalone Cargo project while it is being folded into
# the workspace as `crates/revaro-media`. Keeping it excluded here means the
# existing Go server can keep spawning the same binary name unchanged.
exclude = ["data-plane"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/VesperGlow/revaro"
authors = ["VesperGlow"]

[workspace.dependencies]
# --- workspace members, so members can depend on each other ---
revaro-core = { path = "crates/revaro-core" }
revaro-server = { path = "crates/revaro-server" }
revaro-reader = { path = "crates/revaro-reader" }

# --- shared types (native + wasm32) ---
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde", "wasmbind"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- backend ---
axum = { version = "0.8", features = ["http2", "json", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
mime_guess = "2"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace", "fs", "compression-gzip", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

# --- frontend (wasm32) ---
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "0.3"
web-sys = "0.3"
gloo-net = "0.7"
console_error_panic_hook = "0.1"

# --- crypto / hashing ---
base64 = "0.22"
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
subtle = "2.6"

# --- reader / media (native only) ---
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libarchive2 = "0.2.1"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
quick-xml = "0.38"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
